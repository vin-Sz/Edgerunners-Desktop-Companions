# The Windows self-test on Talia's own build, on GitHub's machine, so it never has to run on your working PC.
# It's a separate file from ci.yml because ci.yml is Capri's and merges in from capri-desktop.
name: Talia self-test

on:
  push:
    branches-ignore: [gh-pages]
    # Anything her build is made from runs it, including Capri's code and art. The ! lines skip what never goes into her
    # build, so saving a Krita file or a note doesn't cost a test. Later lines win, so personality.md goes back in last.
    paths:
      - 'app/**'
      - 'assets/**'
      - 'characters/**'
      - 'ci/**'
      - '.github/workflows/talia-smoke.yml'
      - '!**/*.md'
      - '!characters/lucy/**'
      - '!characters/*/krita/**'
      - 'characters/talia/personality.md'
  workflow_dispatch:

concurrency:
  group: talia-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    # Her build as it ships, and again with characters/talia/placeholders filling every sheet she hasn't drawn yet, so
    # nothing of Capri's art is left and the self-test shows what her own art will run into. A release never has those.
    strategy:
      fail-fast: false
      matrix:
        art: [as-drawn, placeholders]
    name: windows (${{ matrix.art }})
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Make the screen 1080p
        shell: pwsh
        run: ./ci/wide-screen.ps1
      # Same short temp folder as ci.yml, for the same 260-letter path limit.
      - name: Build as Talia and self-test
        shell: pwsh
        env:
          CHARACTER_PLACEHOLDERS: ${{ matrix.art == 'placeholders' && '1' || '' }}
        run: |
          # Keeps why the script stopped, so the next step can show it without a GitHub login.
          try { ./ci/build-windows.ps1 -OutputDirectory "$env:RUNNER_TEMP\w" -Character talia -SmokeTest -SmokeSeconds 900 }
          catch {
            ($_.Exception.Message + "`n" + $_.InvocationInfo.PositionMessage) | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'why-it-stopped.txt')
            throw
          }
      # Puts the reason on the run's summary page, where it can be read without opening the log.
      - name: Say what failed
        if: failure()
        shell: pwsh
        run: |
          # The self-test writes to runtime and the installer check that follows it writes to package.
          $reasons = [ordered]@{
            'self-test' = Join-Path $env:RUNNER_TEMP 'w\smoke\runtime\failure.txt'
            'installer check' = Join-Path $env:RUNNER_TEMP 'w\smoke\package\failure.txt'
            'why the script stopped' = Join-Path $env:RUNNER_TEMP 'why-it-stopped.txt'
          }
          foreach ($part in $reasons.Keys) {
            if (-not (Test-Path -LiteralPath $reasons[$part])) { continue }
            $text = (Get-Content -LiteralPath $reasons[$part] -Raw) -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            if ($text.Length -gt 3000) { $text = $text.Substring(0, 3000) }
            Write-Output "::error title=Talia self-test (${{ matrix.art }}) - $part::$text"
          }
          # A check can fail without writing failure.txt, and then its reason is only in the results.
          $results = Join-Path $env:RUNNER_TEMP 'w\smoke\runtime\smoke-test.txt'
          if (Test-Path -LiteralPath $results) {
            $lines = @(Get-Content -LiteralPath $results | Where-Object { $_ -match '^(FAIL |TOTAL )' })
            $text = ($lines -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            if ($text.Length -gt 3000) { $text = $text.Substring(0, 3000) }
            if ($text) { Write-Output "::error title=Talia self-test (${{ matrix.art }}) - failed checks::$text" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-talia-${{ matrix.art }}
          path: ${{ runner.temp }}/w/smoke
