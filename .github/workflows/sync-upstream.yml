# Merges lachydotmcg/capri-desktop into main whenever it has new commits. The README always keeps this fork's version.
# Any other conflict stops the sync and turns the run red, with the files listed on its summary page, so it can be merged
# by hand. It can't open an issue, because this fork has issues turned off.
#
# Upstream sometimes changes its own workflow files, and GitHub won't let the built-in token push those. Add a
# fine-grained token with Contents and Workflows (read and write) on this repo as the SYNC_TOKEN secret to cover that.
name: Sync upstream

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'vin-Sz/Edgerunners-Desktop-Companions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Merge capri-desktop
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/lachydotmcg/capri-desktop.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with capri-desktop."
            exit 0
          fi

          new=$(git log --oneline HEAD..upstream/main | wc -l)
          tip=$(git rev-parse --short upstream/main)
          git merge --no-ff --no-commit upstream/main || true

          conflicts=$(git diff --name-only --diff-filter=U)
          for file in $conflicts; do
            if [ "$file" = "README.md" ]; then
              git checkout --ours README.md
              git add README.md
            fi
          done

          left=$(git diff --name-only --diff-filter=U)
          if [ -n "$left" ]; then
            git merge --abort
            echo "conflicts<<EOF" >> "$GITHUB_OUTPUT"
            echo "$left" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "tip=$tip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(git show upstream/main:site/release.json 2>/dev/null | grep -oP '"tag_name"\s*:\s*"v?\K[^"]+' || true)
          git commit -F - <<EOF
          Merge capri-desktop${version:+ $version} from upstream

          Brings in lachydotmcg/capri-desktop up to $tip ($new new commits).
          README keeps this fork's version.
          EOF
          git push origin HEAD:main
          echo "merged=$tip" >> "$GITHUB_OUTPUT"

      - name: Say what conflicts
        if: steps.merge.outputs.conflicts != ''
        env:
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          TIP: ${{ steps.merge.outputs.tip }}
        run: |
          {
            echo "Merging capri-desktop up to $TIP conflicts in:"
            echo
            echo "$CONFLICTS" | sed 's/^/- `/; s/$/`/'
            echo
            echo 'Merge it by hand with `git fetch upstream` and `git merge upstream/main`. This sync tries again every day.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Merging capri-desktop conflicts in: $(echo $CONFLICTS)"
          exit 1
