# Merges lachydotmcg/capri-desktop into main whenever it has new commits, through ci/merge-capri.ps1. That fixes the
# conflicts that keep coming back and only pushes a merge that compiles, which is why this runs on Windows. Anything else
# stops the sync and turns the run red, with the details on its summary page, so it can be merged by hand.
#
# Upstream sometimes changes its own workflow files, and GitHub won't let the built-in token push those. Add a
# fine-grained token with Contents and Workflows (read and write) on this repo as the SYNC_TOKEN secret to cover that.
# GitHub also doesn't start tests for a push made with the built-in token, so a synced merge is only compiled until then.
name: Sync upstream

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'vin-Sz/Edgerunners-Desktop-Companions'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Merge capri-desktop
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $before = git rev-parse HEAD
          ./ci/merge-capri.ps1 -GiveUpOnFailure
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::The Capri merge needs a person. The run's summary page says why."; exit 1 }
          if ((git rev-parse HEAD) -ne $before) { git push origin HEAD:main; if ($LASTEXITCODE -ne 0) { exit 1 } }
