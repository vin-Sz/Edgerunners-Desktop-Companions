# Builds Lucy Desktop and publishes it as a release of this repository, only when started by hand:
# Actions > Release Lucy Desktop > Run workflow. The app's updater looks at these releases (characters/app.txt).
# The version is Capri's (app/AssemblyInfo.cs) plus our own fourth number, like 0.7.7.1, then 0.7.7.2. After a Capri
# update it starts again at 1 (0.7.8.1), and is still newer than every release before it.
name: Release Lucy Desktop

on:
  workflow_dispatch:
    inputs:
      number:
        description: "Our own number for this Capri version: 1 for the first release, then 2, 3..."
        required: true
        default: '1'
      notes:
        description: "What's new, for the release page (optional)"
        required: false

permissions:
  contents: write

concurrency:
  group: release-lucy
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'vin-Sz/lucy-desktop'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ inputs.number }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $capri = [regex]::Match((Get-Content app/AssemblyInfo.cs -Raw), 'AssemblyVersion\("(\d+\.\d+\.\d+)"\)').Groups[1].Value
          if (-not $capri) { throw "Couldn't read Capri's version from app/AssemblyInfo.cs." }
          if ($env:NUMBER -notmatch '^[1-9]\d{0,3}$') { throw "The number has to be a whole number from 1 up." }
          $version = "$capri.$env:NUMBER"
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) { throw "v$version is already released. Run it again with the next number." }
          $global:LASTEXITCODE = 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "capri=$capri" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        env:
          CHARACTER_VERSION: ${{ steps.version.outputs.version }}
        run: ./ci/build-windows.ps1 -OutputDirectory out/windows -Character lucy

      - name: Publish the release
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CAPRI: ${{ steps.version.outputs.capri }}
        run: |
          # The updater picks the installer by this name and checks it against SHA256SUMS.txt, since it isn't signed.
          $name = "LucyDesktop-Setup-$env:VERSION.exe"
          Copy-Item out/windows/Capri-Setup.exe "out/$name"
          $hash = (Get-FileHash "out/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/out/SHA256SUMS.txt", "$hash  $name`n")
          $notes = if ($env:NOTES) { $env:NOTES } else { "Lucy Desktop $env:VERSION, built on Capri $env:CAPRI." }
          gh release create "v$env:VERSION" "out/$name" out/SHA256SUMS.txt --title "Lucy Desktop $env:VERSION" --notes $notes --target $env:GITHUB_SHA
